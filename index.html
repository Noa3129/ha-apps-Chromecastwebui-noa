<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f9ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chromecast Remote">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Chromecast Remote</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="device">
      <div class="device-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"/></svg></div>
      <div class="device-copy"><h1>Chromecast</h1><p id="deviceSubtitle">Home Assistant · 接続確認中</p></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" aria-label="テーマ切り替え" title="テーマ切り替え"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg></button>
      <button class="icon-btn" data-action="電源" aria-label="電源" title="電源"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M6.2 5.8a8 8 0 1 0 11.6 0"/></svg></button>
    </div>
  </header>

  <section><div class="pad-wrap"><div class="pad" aria-label="方向キー">
    <button class="key up" data-action="上" aria-label="上"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button>
    <button class="key left" data-action="左" aria-label="左"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
    <button class="key center" data-action="決定" aria-label="決定">OK</button>
    <button class="key right" data-action="右" aria-label="右"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
    <button class="key down" data-action="下" aria-label="下"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg></button>
  </div></div></section>

  <section><div class="secondary-row">
    <button class="tile" data-action="戻る"><svg viewBox="0 0 24 24"><path d="m10 14-5-5 5-5"/><path d="M5 9h9a6 6 0 0 1 0 12h-2"/></svg><span>戻る</span></button>
    <button class="tile" data-action="ホーム"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span>ホーム</span></button>
    <button class="tile" data-action="メニュー"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>メニュー</span></button>
  </div></section>

  <section><div class="volume-rocker" aria-label="テレビ音量">
    <button data-action="音量を下げる" aria-label="音量を下げる"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 12h5"/></svg></button>
    <button data-action="音量を上げる" aria-label="音量を上げる"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 12h5M18.5 9.5v5"/></svg></button>
  </div></section>

  <section aria-label="ミュートとアプリ起動"><div class="app-row">
    <button class="bottom-key" data-action="ミュート" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg><span>ミュート</span></button>
    <button class="app-key" data-action="YouTubeを開く" data-app="youtube" aria-label="YouTubeを開く"><span class="app-logo youtube-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 8.2a2.6 2.6 0 0 0-1.8-1.8C17.6 6 12 6 12 6s-5.6 0-7.2.4A2.6 2.6 0 0 0 3 8.2 27 27 0 0 0 2.6 12 27 27 0 0 0 3 15.8a2.6 2.6 0 0 0 1.8 1.8C6.4 18 12 18 12 18s5.6 0 7.2-.4a2.6 2.6 0 0 0 1.8-1.8 27 27 0 0 0 .4-3.8 27 27 0 0 0-.4-3.8Z"/><path d="m10 15 5-3-5-3v6Z"/></svg></span><span>YouTube</span></button>
    <button class="app-key" data-action="Netflixを開く" data-app="netflix" aria-label="Netflixを開く"><span class="app-logo netflix-logo" aria-hidden="true">N</span><span>Netflix</span></button>
  </div></section>
  <footer class="status"><span class="status-dot"></span><span id="statusText">デザインプレビュー · 実機には未接続</span></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./app.js" defer></script>
</body>
</html>
