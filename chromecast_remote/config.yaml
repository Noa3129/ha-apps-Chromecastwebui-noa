name: "Chromecast Remote"
version: "0.4.4"
slug: "chromecast_remote"
description: "iOS-friendly Chromecast and Android TV remote powered by Home Assistant's Android TV Remote integration."
arch:
  - amd64
  - aarch64
  - armv7
build_from:
  amd64: node:22-alpine
  aarch64: node:22-alpine
  armv7: node:22-alpine
startup: application
boot: auto
init: false
ports:
  "9090/tcp": 5090
ports_description:
  "9090/tcp": "Chromecast Remote web interface"
webui: "http://[HOST]:[PORT:9090]"
ingress: true
ingress_port: 9090
panel_icon: mdi:remote-tv
panel_title: Chromecast Remote
homeassistant_api: true
options:
  remote_entity: ""
  app_1_label: ""
  app_1_image_url: ""
  app_1_deep_link: ""
  app_2_label: ""
  app_2_image_url: ""
  app_2_deep_link: ""
schema:
  remote_entity: str
  app_1_label: str
  app_1_image_url: str
  app_1_deep_link: str
  app_2_label: str
  app_2_image_url: str
  app_2_deep_link: str
stage: experimental
