services:
  chromecast-remote:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      HA_URL: "${HA_URL:-}"
      HA_TOKEN: "${HA_TOKEN:-}"
      HA_REMOTE_ENTITY: "${HA_REMOTE_ENTITY:-}"
      APP_1_LABEL: "${APP_1_LABEL:-}"
      APP_1_IMAGE_URL: "${APP_1_IMAGE_URL:-}"
      APP_1_DEEP_LINK: "${APP_1_DEEP_LINK:-}"
      APP_2_LABEL: "${APP_2_LABEL:-}"
      APP_2_IMAGE_URL: "${APP_2_IMAGE_URL:-}"
      APP_2_DEEP_LINK: "${APP_2_DEEP_LINK:-}"
    restart: unless-stopped
